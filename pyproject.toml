[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dfn-cave-studio"
version = "0.10.0"
description = "Discrete Fracture Network modeling for underground block cave mining research"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "DFN Cave Studio Development Team"}
]
keywords = ["dfn", "fracture", "mining", "block-caving", "geomechanics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "PySide6>=6.11",
    "pyvista>=0.48",
    "pyvistaqt>=0.12",
    "vtk>=9.6",
    "numpy>=2.0",
    "scipy>=1.15",
    "pandas>=3.0",
    "openpyxl>=3.1",
    "trimesh>=4.12",
    "networkx>=3.6",
    "matplotlib>=3.10",
    "pydantic>=2.13",
    "h5py>=3.16",
    "zarr>=3.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-qt>=4.5",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.8",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]

[project.scripts]
dfn-cave-studio = "dfn_cave_studio.app:main"

[project.gui-scripts]
dfn-cave-studio = "dfn_cave_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "scientific: Scientific validation tests",
    "gui: GUI tests",
    "slow: Slow tests (>5s)",
    "performance: Performance benchmarks",
    "vtk_render: Tests that require real VTK/OpenGL rendering (not run on headless CI)",
]

[tool.coverage.run]
source = ["src/dfn_cave_studio"]
omit = [
    "tests/*",
    "*/test_*",
    "src/dfn_cave_studio/ui/main_window.py",
    "src/dfn_cave_studio/ui/qt_adapter.py",
    "src/dfn_cave_studio/workers/*",
    "src/dfn_cave_studio/app/*",
    "src/dfn_cave_studio/core/logger.py",
    "src/dfn_cave_studio/ui/dialogs/*",
    "src/dfn_cave_studio/ui/panels/*",
    "src/dfn_cave_studio/ui/widgets/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"

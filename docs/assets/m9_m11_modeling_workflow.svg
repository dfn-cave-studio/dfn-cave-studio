<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">M9到M11.1建模流程</title><desc id="desc">P10、Fisher P32、尺寸、第一次体素场、多尺度显式DFN、亚网格P32、精确求交和云图。</desc>
  <defs><style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2937}.t{font-size:26px;font-weight:700}.s{font-size:14px;fill:#4b5563}.h{font-size:16px;font-weight:700}.b{font-size:13px}.box{stroke-width:2;rx:12}.d{fill:#fff7ed;stroke:#ea580c}.st{fill:#f5f3ff;stroke:#7c3aed}.v{fill:#fdf2f8;stroke:#db2777}.p{fill:#ecfdf5;stroke:#059669}.a{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#m)}.dash{stroke:#9ca3af;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
  <rect width="1400" height="760" fill="white"/><text x="40" y="45" class="t">M9 → M10 → M11.1 科学建模与显示</text><text x="40" y="70" class="s">橙=科学计算　紫=持久化数组　粉=会话显示　虚线=单独诊断或验证分支</text>
  <rect class="box p" x="40" y="115" width="230" height="125"/><text x="155" y="147" class="h" text-anchor="middle">Calibration 数据</text><text x="60" y="180" class="b">Formal trajectories / fractures</text><text x="60" y="205" class="b">Domain / Joint Set / Holdout</text>
  <rect class="box d" x="320" y="100" width="235" height="155"/><text x="437" y="133" class="h" text-anchor="middle">M9 密度与方向</text><text x="340" y="165" class="b">P10：count / trajectory length</text><text x="340" y="190" class="b">Fisher mean + Kappa</text><text x="340" y="215" class="b">Poisson-MLE P32 + exposure</text><text x="340" y="240" class="b">Validation 不进入拟合</text>
  <rect class="box d" x="605" y="100" width="230" height="155"/><text x="720" y="133" class="h" text-anchor="middle">M9 尺寸分布</text><text x="625" y="165" class="b">实测或 ASSUMED prior</text><text x="625" y="190" class="b">fixed / uniform / truncated</text><text x="625" y="215" class="b">E[area] = πE[R²]</text><text x="625" y="240" class="b">自动截断拟合 EXPERIMENTAL</text>
  <rect class="box st" x="885" y="100" width="265" height="155"/><text x="1017" y="133" class="h" text-anchor="middle">M9 第一次体素参数场</text><text x="905" y="165" class="b">GLOBAL_CONSTANT / IDW</text><text x="905" y="190" class="b">cell_state / domain_id</text><text x="905" y="215" class="b">per-set P32 / orientation / Kappa</text><text x="905" y="240" class="b">NO_DATA ≠ TRUE_ZERO</text>
  <path class="a" d="M270 178H315"/><path class="a" d="M555 178H600"/><path class="a" d="M835 178H880"/>
  <rect class="box p" x="1190" y="115" width="175" height="125"/><text x="1277" y="147" class="h" text-anchor="middle">M9 Validation</text><text x="1210" y="180" class="b">held-out holes</text><text x="1210" y="205" class="b">MAE / RMSE / Bias</text><path class="dash" d="M1150 178H1185"/>

  <rect class="box d" x="320" y="340" width="280" height="180"/><text x="460" y="373" class="h" text-anchor="middle">M10 多尺度显式生成</text><text x="340" y="405" class="b">λ=P32×V/(πE[R²])；Poisson</text><text x="340" y="430" class="b">Fisher normals + voxel centres</text><text x="340" y="455" class="b">Stochastic / Conditioned / Deterministic</text><text x="340" y="480" class="b">SMALL / MEDIUM / LARGE</text><text x="340" y="505" class="b">Generation Domain clipping</text>
  <path class="a" d="M1017 255V300H460V335"/>
  <rect class="box st" x="650" y="330" width="265" height="200"/><text x="782" y="363" class="h" text-anchor="middle">M10 持久化契约</text><text x="670" y="395" class="b">Columnar center / normal / radius</text><text x="670" y="420" class="b">clipped polygon ragged arrays</text><text x="670" y="445" class="b">P32_explicit_target</text><text x="670" y="470" class="b">P32_subgrid（可建模未显式）</text><text x="670" y="495" class="b">unresolved orientation（单独）</text><path class="a" d="M600 430H645"/>
  <rect class="box d" x="965" y="340" width="300" height="180"/><text x="1115" y="373" class="h" text-anchor="middle">M11.1 精确圆盘—体素求交</text><text x="985" y="405" class="b">tight AABB candidates</text><text x="985" y="430" class="b">analytic disk–convex polygon area</text><text x="985" y="455" class="b">point/line contact area = 0</text><text x="985" y="480" class="b">half-open internal ownership</text><text x="985" y="505" class="b">stable sparse merge / cancel</text><path class="a" d="M915 430H960"/>

  <rect class="box st" x="650" y="615" width="310" height="105"/><text x="805" y="647" class="h" text-anchor="middle">M11 稀疏与体素结果</text><text x="670" y="679" class="b">ordinal / voxel / intersection_area</text><text x="670" y="704" class="b">P32_total = explicit intersection + subgrid</text><path class="a" d="M1115 520V570H805V610"/>
  <rect class="box v" x="1010" y="600" width="350" height="130"/><text x="1185" y="632" class="h" text-anchor="middle">M11 Visualization（session-only）</text><text x="1030" y="664" class="b">Voxel / Surface / Orthogonal / Arbitrary</text><text x="1030" y="689" class="b">Plane Cutaway / Box Cutaway</text><text x="1030" y="714" class="b">Exact authoritative；Smooth 仅视觉插值</text><path class="a" d="M960 668H1005"/>
  <rect class="box p" x="40" y="610" width="500" height="110"/><text x="290" y="642" class="h" text-anchor="middle">守恒与解释</text><text x="60" y="674" class="b">target = explicit target + subgrid + unresolved orientation</text><text x="60" y="699" class="b">M11 total 不含 unresolved；Poisson realized 允许波动</text><path class="dash" d="M650 668H545"/>
</svg>

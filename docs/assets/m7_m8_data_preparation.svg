<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-labelledby="title desc">
  <title id="title">M7/M8 数据准备流程</title><desc id="desc">从文件表头规范化、映射、数据库状态和质量检查到轨迹、方向完整性、留出、结构域和节理组。</desc>
  <defs><style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2937}.t{font-size:26px;font-weight:700}.s{font-size:14px;fill:#4b5563}.h{font-size:16px;font-weight:700}.b{font-size:13px}.box{stroke-width:2;rx:12}.i{fill:#e8f1ff;stroke:#2563eb}.p{fill:#ecfdf5;stroke:#059669}.d{fill:#fff7ed;stroke:#ea580c}.st{fill:#f5f3ff;stroke:#7c3aed}.bad{fill:#fff1f2;stroke:#e11d48}.a{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
  <rect width="1400" height="690" fill="white"/><text x="40" y="45" class="t">M7/M8 数据准备与审计链</text><text x="40" y="70" class="s">Raw 永久可追溯；Formal 是唯一下游投影；Excluded 与 Pending 不被静默删除</text>
  <rect class="box i" x="40" y="115" width="190" height="125"/><text x="135" y="145" class="h" text-anchor="middle">CSV / XLSX / XLS</text><text x="60" y="177" class="b">五类数据独立、乱序导入</text><text x="60" y="202" class="b">原始表头与原值保留</text>
  <rect class="box p" x="280" y="115" width="215" height="125"/><text x="387" y="145" class="h" text-anchor="middle">规范化与字段映射</text><text x="300" y="177" class="b">trim / BOM / case-fold</text><text x="300" y="202" class="b">空格/连字符 → underscore</text>
  <rect class="box p" x="545" y="115" width="215" height="125"/><text x="652" y="145" class="h" text-anchor="middle">Required / Conflict</text><text x="565" y="177" class="b">映射后检查必填字段</text><text x="565" y="202" class="b">多候选必须人工确认</text>
  <rect class="box st" x="810" y="105" width="270" height="145"/><text x="945" y="137" class="h" text-anchor="middle">BoreholeDatabase</text><text x="830" y="169" class="b">BoreholeRecord + provenance</text><text x="830" y="194" class="b">Raw / Formal / Excluded / Pending</text><text x="830" y="219" class="b">ModificationEvent / QualityIssue</text>
  <path class="a" d="M230 178H275"/><path class="a" d="M495 178H540"/><path class="a" d="M760 178H805"/>

  <rect class="box p" x="420" y="315" width="260" height="135"/><text x="550" y="347" class="h" text-anchor="middle">Data Quality</text><text x="440" y="379" class="b">用户接受安全 auto-fix</text><text x="440" y="404" class="b">手动编辑 / 排除 / 重分类</text><text x="440" y="429" class="b">Pending=0 且 unresolved ERROR=0</text>
  <path class="a" d="M945 250V280H550V310"/>
  <rect class="box bad" x="75" y="325" width="265" height="115"/><text x="207" y="357" class="h" text-anchor="middle">审计分支</text><text x="95" y="389" class="b">Excluded：明确原因，仍保留</text><text x="95" y="414" class="b">Pending：等待 Collar/关联</text><path class="a" d="M415 383H345"/>
  <rect class="box st" x="760" y="315" width="270" height="135"/><text x="895" y="347" class="h" text-anchor="middle">Formal Projection</text><text x="780" y="379" class="b">数据库值 = 科学对象实际值</text><text x="780" y="404" class="b">无静默 azimuth/dip 修正</text><text x="780" y="429" class="b">BoreholeCollection</text><path class="a" d="M680 383H755"/>

  <rect class="box d" x="75" y="525" width="245" height="105"/><text x="197" y="558" class="h" text-anchor="middle">Minimum Curvature</text><text x="95" y="590" class="b">完整轨迹 + 观测空间位置</text><text x="95" y="615" class="b">模型边界覆盖检查</text>
  <rect class="box d" x="385" y="525" width="250" height="105"/><text x="510" y="558" class="h" text-anchor="middle">方向完整性</text><text x="405" y="590" class="b">FULL_ORIENTATION：三维方向</text><text x="405" y="615" class="b">DIP_ONLY：受限密度证据</text>
  <rect class="box d" x="700" y="525" width="250" height="105"/><text x="825" y="558" class="h" text-anchor="middle">Calibration / Validation</text><text x="720" y="590" class="b">固定 seed / 手动 / 分层</text><text x="720" y="615" class="b">Validation 不参与拟合</text>
  <rect class="box d" x="1015" y="525" width="310" height="105"/><text x="1170" y="558" class="h" text-anchor="middle">Domain / Joint Set</text><text x="1035" y="590" class="b">半开区间；Mode A imported set_id</text><text x="1035" y="615" class="b">Mode B axial spherical K-Means++</text>
  <path class="a" d="M895 450V485H197V520"/><path class="a" d="M895 450V485H510V520"/><path class="a" d="M320 578H380"/><path class="a" d="M635 578H695"/><path class="a" d="M950 578H1010"/>
</svg>

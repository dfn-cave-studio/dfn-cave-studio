name: Milestone Review

permissions:
  contents: write
  actions: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-html pytest-json-report

      - name: Run unit tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: pytest tests/unit/ -v --tb=short --json-report --json-report-file=test-results-unit.json

      - name: Run integration tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: pytest tests/integration/ -v --tb=short --json-report --json-report-file=test-results-integration.json

      - name: Run scientific validation
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: pytest tests/scientific/ -v --tb=short --json-report --json-report-file=test-results-scientific.json

      - name: Run all tests with coverage (excl. slow/GUI)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          pytest tests/unit/ tests/integration/ tests/scientific/ -v --tb=short `
            --cov=src/dfn_cave_studio `
            --cov-report=xml:coverage.xml `
            --cov-report=html:coverage_html `
            --html=test-report.html `
            --self-contained-html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-report.html
            coverage.xml
            coverage_html/
            test-results-*.json
            .pytest_cache/

      - name: Upload coverage to artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  review-package:
    name: Build Review Package
    runs-on: windows-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-html pytest-json-report

      - name: Run full test suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          pytest tests/unit/ tests/integration/ tests/scientific/ -v --tb=long `
            --junitxml=junit.xml `
            --json-report --json-report-file=test_results.json `
            --cov=src/dfn_cave_studio `
            --cov-report=xml:coverage.xml `
            --cov-report=html:coverage_html `
            --html=test-report.html `
            --self-contained-html

      - name: Generate review package
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/build_review_package.py

      - name: Compress review package
        shell: pwsh
        run: |
          $VERSION = "$env:GITHUB_REF_NAME"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $reviewDir = "docs/review/$VERSION"
          if (Test-Path $reviewDir) {
            Compress-Archive -Path "$reviewDir/*" -DestinationPath "dist/dfn-cave-studio-$VERSION-review.zip" -Force
          }
          Compress-Archive -Path src/,tests/,*.md,*.toml,*.txt,LICENSE,conftest.py,examples/ -DestinationPath "dist/dfn-cave-studio-$VERSION-source.zip" -Force

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: review-package
          path: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

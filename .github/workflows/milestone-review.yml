name: Milestone Review

permissions:
  contents: write
  actions: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-json-report pytest-qt pytest-timeout

      - name: Run core tests with coverage
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          pytest tests/unit/ tests/integration/ tests/scientific/ tests/end_to_end/ `
            -m "not real_vtk_render" `
            -v --tb=short `
            --json-report --json-report-file=test_results_core.json `
            --cov=src/dfn_cave_studio `
            --cov-report= `
            --timeout=120 `
            --junitxml=junit-core.xml

      - name: Run GUI tests with coverage
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          pytest tests/gui/ `
            -m "not real_vtk_render" `
            -v --tb=short `
            --json-report --json-report-file=test_results_gui.json `
            --cov=src/dfn_cave_studio `
            --cov-append `
            --cov-report= `
            --timeout=60 `
            --junitxml=junit-gui.xml

      - name: Combine coverage and enforce threshold
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          coverage xml -o coverage.xml
          coverage html -d coverage_html
          coverage report --fail-under=80

      - name: Upload validated test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage_html/
            test_results_*.json
            junit-*.xml

  real-vtk-render:
    name: Real VTK rendering (Linux Mesa/Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Mesa, Xvfb, and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            xvfb \
            xauth \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            mesa-utils
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-json-report pytest-qt pytest-timeout

      - name: Run real VTK pixel and widget tests with software OpenGL
        env:
          PYTHONPATH: src
          PYVISTA_OFF_SCREEN: 'true'
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: xcb
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            pytest tests/ \
              -m real_vtk_render \
              -v --tb=short \
              --timeout=180 \
              --json-report --json-report-file=test_results_real_vtk.json \
              --junitxml=junit-real-vtk.xml

      - name: Upload real VTK test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-real-vtk
          path: |
            test_results_real_vtk.json
            junit-real-vtk.xml

  review-package:
    name: Build Review Package
    runs-on: windows-latest
    needs: [test, real-vtk-render]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download validated Python 3.12 test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-results-3.12
          path: .

      - name: Generate review and source packages
        shell: pwsh
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/build_review_package.py

      - name: Verify package outputs
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME"
          $required = @(
            "dist/dfn-cave-studio-$version-review.zip",
            "dist/dfn-cave-studio-$version-source.zip"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing package output: $path"
            }
          }

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: review-package
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
